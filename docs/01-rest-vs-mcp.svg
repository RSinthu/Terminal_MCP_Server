<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>

  <!-- ============ LEFT PANEL : BEFORE MCP ============ -->
  <rect x="20" y="20" width="520" height="560" rx="14" fill="#fff5f5" stroke="#f0b4b4" stroke-width="2"/>
  <text x="280" y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#b02a2a">BEFORE MCP — direct REST integration</text>
  <text x="280" y="82" text-anchor="middle" font-size="13" fill="#8a4a4a">Every tool needs its own custom client code</text>

  <!-- AI app -->
  <rect x="50" y="230" width="150" height="120" rx="12" fill="#ffffff" stroke="#b02a2a" stroke-width="2.5"/>
  <text x="125" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#222">AI App</text>
  <text x="125" y="294" text-anchor="middle" font-size="12" fill="#555">Assistant /</text>
  <text x="125" y="311" text-anchor="middle" font-size="12" fill="#555">Agent + LLM</text>
  <text x="125" y="333" text-anchor="middle" font-size="11" fill="#b02a2a">4 custom clients</text>

  <!-- tools -->
  <rect x="340" y="140" width="170" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="425" y="171" text-anchor="middle" font-size="13" fill="#222">Wikipedia API</text>

  <rect x="340" y="212" width="170" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="425" y="243" text-anchor="middle" font-size="13" fill="#222">Vector DB / RAG</text>

  <rect x="340" y="284" width="170" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="425" y="315" text-anchor="middle" font-size="13" fill="#222">Weather API</text>

  <rect x="340" y="356" width="170" height="52" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="425" y="387" text-anchor="middle" font-size="13" fill="#222">DuckDuckGo Search</text>

  <!-- arrows -->
  <g stroke="#b02a2a" stroke-width="1.8" fill="none" marker-end="url(#redArrow)">
    <path d="M 200 262 L 338 166"/>
    <path d="M 200 278 L 338 238"/>
    <path d="M 200 296 L 338 310"/>
    <path d="M 200 312 L 338 382"/>
  </g>
  <text x="248" y="198" font-size="10.5" fill="#b02a2a" transform="rotate(-33 248 198)">REST #1</text>
  <text x="250" y="252" font-size="10.5" fill="#b02a2a" transform="rotate(-15 250 252)">REST #2</text>
  <text x="250" y="313" font-size="10.5" fill="#b02a2a" transform="rotate(6 250 313)">REST #3</text>
  <text x="248" y="356" font-size="10.5" fill="#b02a2a" transform="rotate(26 248 356)">REST #4</text>

  <rect x="50" y="450" width="460" height="105" rx="10" fill="#ffe9e9" stroke="#e8a0a0" stroke-width="1.4"/>
  <text x="70" y="478" font-size="13" font-weight="700" fill="#b02a2a">The problem</text>
  <text x="70" y="501" font-size="12.5" fill="#5c3333">The provider owns the API. When they change an endpoint,</text>
  <text x="70" y="521" font-size="12.5" fill="#5c3333">a payload, or the auth flow, YOU must rewrite your client.</text>
  <text x="70" y="541" font-size="12.5" fill="#5c3333">N tools = N bespoke integrations = N things that can break.</text>

  <!-- ============ RIGHT PANEL : WITH MCP ============ -->
  <rect x="580" y="20" width="520" height="560" rx="14" fill="#f2f9f4" stroke="#a8d5b5" stroke-width="2"/>
  <text x="840" y="58" text-anchor="middle" font-size="21" font-weight="700" fill="#1f7a45">WITH MCP — one standard protocol</text>
  <text x="840" y="82" text-anchor="middle" font-size="13" fill="#3d6b50">Write the protocol once, plug in any server</text>

  <!-- AI app -->
  <rect x="605" y="230" width="140" height="120" rx="12" fill="#ffffff" stroke="#1f7a45" stroke-width="2.5"/>
  <text x="675" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#222">AI App</text>
  <text x="675" y="294" text-anchor="middle" font-size="12" fill="#555">MCP Host</text>
  <text x="675" y="311" text-anchor="middle" font-size="12" fill="#555">+ MCP Client</text>
  <text x="675" y="333" text-anchor="middle" font-size="11" fill="#1f7a45">1 protocol</text>

  <!-- protocol bar -->
  <rect x="782" y="120" width="46" height="300" rx="10" fill="#1f7a45"/>
  <text x="805" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" transform="rotate(-90 805 270)">MCP PROTOCOL</text>

  <path d="M 747 290 L 778 290" stroke="#1f7a45" stroke-width="2.4" fill="none" marker-end="url(#greenArrow)"/>

  <!-- servers -->
  <rect x="862" y="140" width="200" height="52" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.8"/>
  <text x="962" y="163" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a45">MCP Server</text>
  <text x="962" y="181" text-anchor="middle" font-size="11.5" fill="#444">Wikipedia</text>

  <rect x="862" y="212" width="200" height="52" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.8"/>
  <text x="962" y="235" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a45">MCP Server</text>
  <text x="962" y="253" text-anchor="middle" font-size="11.5" fill="#444">Vector DB / RAG</text>

  <rect x="862" y="284" width="200" height="52" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.8"/>
  <text x="962" y="307" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a45">MCP Server</text>
  <text x="962" y="325" text-anchor="middle" font-size="11.5" fill="#444">Weather API</text>

  <rect x="862" y="356" width="200" height="52" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.8"/>
  <text x="962" y="379" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f7a45">MCP Server</text>
  <text x="962" y="397" text-anchor="middle" font-size="11.5" fill="#444">Terminal (this repo)</text>

  <g stroke="#1f7a45" stroke-width="1.8" fill="none" marker-end="url(#greenArrow)">
    <path d="M 828 166 L 860 166"/>
    <path d="M 828 238 L 860 238"/>
    <path d="M 828 310 L 860 310"/>
    <path d="M 828 382 L 860 382"/>
  </g>

  <rect x="605" y="450" width="460" height="105" rx="10" fill="#e3f4e9" stroke="#a8d5b5" stroke-width="1.4"/>
  <text x="625" y="478" font-size="13" font-weight="700" fill="#1f7a45">The fix</text>
  <text x="625" y="501" font-size="12.5" fill="#2f5340">The provider maintains the server behind the protocol.</text>
  <text x="625" y="521" font-size="12.5" fill="#2f5340">They can change everything inside it — your client code</text>
  <text x="625" y="541" font-size="12.5" fill="#2f5340">stays the same, because the contract never moves.</text>

  <defs>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b02a2a"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a45"/>
    </marker>
  </defs>
</svg>
