<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1160" height="700" fill="#ffffff"/>
  <text x="580" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Running the MCP server in Docker</text>
  <text x="580" y="61" text-anchor="middle" font-size="13" fill="#666">Build once into an image; the host launches a throwaway container per session</text>

  <!-- ================= BUILD PIPELINE ================= -->
  <text x="46" y="102" font-size="12" font-weight="700" fill="#95a1af" letter-spacing="0.8">BUILD — you do this once</text>
  <rect x="40" y="112" width="1080" height="150" rx="12" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.4"/>

  <rect x="70" y="140" width="210" height="96" rx="9" fill="#ffffff" stroke="#7a8798" stroke-width="1.7"/>
  <text x="175" y="164" text-anchor="middle" font-size="12.5" font-weight="700" fill="#39414d">Build context</text>
  <text x="175" y="185" text-anchor="middle" font-size="11.5" fill="#444">main.py</text>
  <text x="175" y="203" text-anchor="middle" font-size="11.5" fill="#444">requirements.txt</text>
  <text x="175" y="221" text-anchor="middle" font-size="11.5" fill="#444">Dockerfile · .dockerignore</text>

  <path d="M 284 188 L 380 188" stroke="#2496ed" stroke-width="2.2" fill="none" marker-end="url(#dBlue)"/>
  <text x="332" y="178" text-anchor="middle" font-size="10.5" fill="#1b6fb0">docker build</text>

  <rect x="386" y="140" width="230" height="96" rx="9" fill="#eaf5fd" stroke="#2496ed" stroke-width="1.9"/>
  <text x="501" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b6fb0">IMAGE</text>
  <text x="501" y="189" text-anchor="middle" font-size="11.5" fill="#333">terminal_server_docker</text>
  <text x="501" y="210" text-anchor="middle" font-size="11" fill="#5a6b7a">python:3.11-slim + deps</text>
  <text x="501" y="227" text-anchor="middle" font-size="11" fill="#5a6b7a">+ your code, frozen</text>

  <path d="M 620 188 L 716 188" stroke="#2496ed" stroke-width="2.2" fill="none" marker-end="url(#dBlue)"/>
  <text x="668" y="178" text-anchor="middle" font-size="10.5" fill="#1b6fb0">docker run</text>

  <rect x="722" y="140" width="230" height="96" rx="9" fill="#ffffff" stroke="#2496ed" stroke-width="1.9" stroke-dasharray="7 4"/>
  <text x="837" y="168" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b6fb0">CONTAINER</text>
  <text x="837" y="189" text-anchor="middle" font-size="11.5" fill="#333">a running instance</text>
  <text x="837" y="210" text-anchor="middle" font-size="11" fill="#5a6b7a">created on connect,</text>
  <text x="837" y="227" text-anchor="middle" font-size="11" fill="#5a6b7a">deleted on exit (--rm)</text>

  <text x="1038" y="180" text-anchor="middle" font-size="11" fill="#8a5a00">optional:</text>
  <text x="1038" y="197" text-anchor="middle" font-size="11" fill="#8a5a00">docker push</text>
  <text x="1038" y="214" text-anchor="middle" font-size="11" fill="#8a5a00">→ Docker Hub</text>
  <path d="M 956 188 L 990 188" stroke="#c98a00" stroke-width="1.8" fill="none" marker-end="url(#dOrange)"/>

  <!-- ================= RUNTIME ================= -->
  <text x="46" y="306" font-size="12" font-weight="700" fill="#95a1af" letter-spacing="0.8">RUNTIME — every time you open the host</text>
  <rect x="40" y="316" width="1080" height="290" rx="12" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.4"/>

  <!-- host app -->
  <rect x="72" y="352" width="216" height="150" rx="11" fill="#eef4fc" stroke="#2b5fa8" stroke-width="2.2"/>
  <text x="180" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#2b5fa8">MCP HOST</text>
  <text x="180" y="401" text-anchor="middle" font-size="12" fill="#333">Claude Desktop</text>
  <rect x="94" y="416" width="172" height="66" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.5"/>
  <text x="180" y="438" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b5fa8">MCP client</text>
  <text x="180" y="457" text-anchor="middle" font-size="10.5" fill="#555">command: "docker"</text>
  <text x="180" y="473" text-anchor="middle" font-size="10.5" fill="#555">instead of "uv"</text>

  <!-- stdio -->
  <rect x="316" y="382" width="52" height="120" rx="9" fill="#3b3b3b"/>
  <text x="342" y="442" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff" transform="rotate(-90 342 442)">stdio pipe</text>
  <path d="M 292 412 L 312 412" stroke="#3b3b3b" stroke-width="2" fill="none" marker-end="url(#dGray)"/>
  <path d="M 372 472 L 352 472" stroke="#3b3b3b" stroke-width="2" fill="none" marker-end="url(#dGray)"/>
  <text x="342" y="520" text-anchor="middle" font-size="10" fill="#666">kept open by -i</text>

  <!-- container -->
  <rect x="396" y="342" width="330" height="220" rx="11" fill="#eaf5fd" stroke="#2496ed" stroke-width="2.4"/>
  <text x="561" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#1b6fb0">CONTAINER</text>
  <text x="561" y="389" text-anchor="middle" font-size="11" fill="#5a6b7a">isolated Linux userland</text>

  <rect x="420" y="402" width="282" height="60" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="561" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#1b6fb0">python main.py</text>
  <text x="561" y="444" text-anchor="middle" font-size="11" fill="#444">MCPServer("Terminal") · run_command</text>

  <rect x="420" y="478" width="282" height="60" rx="8" fill="#ffffff" stroke="#1f7a45" stroke-width="1.5"/>
  <text x="561" y="500" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f7a45">/root/mcp/workspace</text>
  <text x="561" y="520" text-anchor="middle" font-size="10.5" fill="#444">DOCKER_CONTAINER=true selects this path</text>

  <!-- bind mount -->
  <path d="M 706 508 L 820 508" stroke="#1f7a45" stroke-width="2.4" fill="none" marker-end="url(#dGreen)"/>
  <path d="M 820 528 L 706 528" stroke="#1f7a45" stroke-width="2.4" fill="none" marker-end="url(#dGreen)"/>
  <text x="763" y="498" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f7a45">bind mount</text>
  <text x="763" y="551" text-anchor="middle" font-size="10" fill="#3d6b50">-v host:container</text>

  <!-- host disk -->
  <rect x="828" y="470" width="262" height="76" rx="9" fill="#f2f9f4" stroke="#1f7a45" stroke-width="2"/>
  <text x="959" y="495" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f7a45">YOUR DISK</text>
  <text x="959" y="516" text-anchor="middle" font-size="11" fill="#333">C:\Users\you\mcp\workspace</text>
  <text x="959" y="534" text-anchor="middle" font-size="10.5" fill="#3d6b50">the only writable window out</text>

  <!-- isolation note -->
  <rect x="828" y="352" width="262" height="98" rx="9" fill="#fff5f5" stroke="#f0b4b4" stroke-width="1.5"/>
  <text x="959" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="#b02a2a">Everything else is sealed</text>
  <text x="848" y="398" font-size="10.5" fill="#5c3333">The container cannot see C:\ , your</text>
  <text x="848" y="415" font-size="10.5" fill="#5c3333">home folder, your SSH keys, or any</text>
  <text x="848" y="432" font-size="10.5" fill="#5c3333">path you did not explicitly mount.</text>

  <!-- footnote -->
  <rect x="40" y="622" width="1080" height="58" rx="9" fill="#f7f9fb" stroke="#dde3ea" stroke-width="1.3"/>
  <text x="58" y="644" font-size="12" fill="#39414d"><tspan font-weight="700">Why this matters:</tspan> the native setup needs the right Python, the right uv, the right absolute paths — per machine. The Docker setup needs Docker.</text>
  <text x="58" y="664" font-size="12" fill="#39414d">Anyone who can pull the image runs the identical server, and the blast radius of a shell tool shrinks from "the whole PC" to "one mounted folder".</text>

  <defs>
    <marker id="dBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2496ed"/>
    </marker>
    <marker id="dGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="dGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a45"/>
    </marker>
    <marker id="dOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a00"/>
    </marker>
  </defs>
</svg>
