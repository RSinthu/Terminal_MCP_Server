<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="1120" height="620" fill="#ffffff"/>
  <text x="560" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">MCP Components — Host, Client, Server, Service</text>
  <text x="560" y="66" text-anchor="middle" font-size="13" fill="#666">You build the left side. Providers own the right side. The protocol in the middle never changes.</text>

  <!-- ownership bands -->
  <text x="185" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#2b5fa8" letter-spacing="1">YOU BUILD / RUN THIS</text>
  <text x="880" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#8a5a00" letter-spacing="1">MANAGED BY SERVICE PROVIDERS</text>

  <!-- ===== MCP HOST ===== -->
  <rect x="40" y="115" width="290" height="400" rx="14" fill="#eef4fc" stroke="#2b5fa8" stroke-width="2.5"/>
  <text x="185" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#2b5fa8">MCP HOST</text>
  <text x="185" y="167" text-anchor="middle" font-size="11.5" fill="#4a6a94">Claude Desktop · Cursor · your app</text>

  <!-- clients inside host -->
  <rect x="70" y="190" width="230" height="46" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.6"/>
  <text x="185" y="219" text-anchor="middle" font-size="13" fill="#222">MCP Client 1</text>

  <rect x="70" y="248" width="230" height="46" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.6"/>
  <text x="185" y="277" text-anchor="middle" font-size="13" fill="#222">MCP Client 2</text>

  <rect x="70" y="306" width="230" height="46" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.6"/>
  <text x="185" y="335" text-anchor="middle" font-size="13" fill="#222">MCP Client 3</text>

  <rect x="70" y="364" width="230" height="46" rx="8" fill="#ffffff" stroke="#2b5fa8" stroke-width="1.6"/>
  <text x="185" y="393" text-anchor="middle" font-size="13" fill="#222">MCP Client 4</text>

  <text x="185" y="440" text-anchor="middle" font-size="11.5" fill="#4a6a94">One client per server — 1:1 connection</text>
  <text x="185" y="459" text-anchor="middle" font-size="11.5" fill="#4a6a94">Created and owned by the host</text>
  <text x="185" y="490" text-anchor="middle" font-size="11.5" fill="#4a6a94">The host also holds the LLM conversation</text>

  <!-- ===== PROTOCOL COLUMN ===== -->
  <rect x="372" y="150" width="56" height="330" rx="10" fill="#3b3b3b"/>
  <text x="400" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" transform="rotate(-90 400 315)">MCP PROTOCOL</text>
  <text x="400" y="510" text-anchor="middle" font-size="11" fill="#666">JSON-RPC 2.0</text>
  <text x="400" y="528" text-anchor="middle" font-size="11" fill="#666">stdio / HTTP</text>

  <g stroke="#3b3b3b" stroke-width="1.8" fill="none" marker-end="url(#gArrow)">
    <path d="M 302 213 L 370 213"/>
    <path d="M 302 271 L 370 271"/>
    <path d="M 302 329 L 370 329"/>
    <path d="M 302 387 L 370 387"/>
  </g>

  <!-- ===== SERVERS ===== -->
  <rect x="470" y="190" width="190" height="46" rx="8" fill="#fff8e8" stroke="#c98a00" stroke-width="1.8"/>
  <text x="565" y="219" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">MCP Server 1</text>

  <rect x="470" y="248" width="190" height="46" rx="8" fill="#fff8e8" stroke="#c98a00" stroke-width="1.8"/>
  <text x="565" y="277" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">MCP Server 2</text>

  <rect x="470" y="306" width="190" height="46" rx="8" fill="#fff8e8" stroke="#c98a00" stroke-width="1.8"/>
  <text x="565" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">MCP Server 3</text>

  <rect x="470" y="364" width="190" height="46" rx="8" fill="#fff8e8" stroke="#c98a00" stroke-width="1.8"/>
  <text x="565" y="393" text-anchor="middle" font-size="13" font-weight="600" fill="#8a5a00">MCP Server 4</text>

  <g stroke="#3b3b3b" stroke-width="1.8" fill="none" marker-end="url(#gArrow)">
    <path d="M 430 213 L 468 213"/>
    <path d="M 430 271 L 468 271"/>
    <path d="M 430 329 L 468 329"/>
    <path d="M 430 387 L 468 387"/>
  </g>

  <!-- ===== SERVICES ===== -->
  <rect x="740" y="190" width="230" height="46" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="855" y="219" text-anchor="middle" font-size="12.5" fill="#222">Code repository / Git</text>

  <rect x="740" y="248" width="230" height="46" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="855" y="277" text-anchor="middle" font-size="12.5" fill="#222">Database / RAG store</text>

  <rect x="740" y="306" width="230" height="46" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="855" y="335" text-anchor="middle" font-size="12.5" fill="#222">Third-party APIs</text>

  <rect x="740" y="364" width="230" height="46" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.6"/>
  <text x="855" y="393" text-anchor="middle" font-size="12.5" fill="#222">Search engine / local shell</text>

  <g stroke="#c98a00" stroke-width="1.8" fill="none" marker-end="url(#oArrow)">
    <path d="M 662 213 L 738 213"/>
    <path d="M 662 271 L 738 271"/>
    <path d="M 662 329 L 738 329"/>
    <path d="M 662 387 L 738 387"/>
  </g>
  <text x="700" y="440" text-anchor="middle" font-size="11" fill="#8a5a00">native SDK,</text>
  <text x="700" y="456" text-anchor="middle" font-size="11" fill="#8a5a00">REST, SQL…</text>

  <!-- ===== LLM ===== -->
  <rect x="740" y="470" width="230" height="70" rx="10" fill="#f3edfa" stroke="#7a4fb5" stroke-width="2"/>
  <text x="855" y="498" text-anchor="middle" font-size="14" font-weight="700" fill="#5c3a8c">LLM</text>
  <text x="855" y="520" text-anchor="middle" font-size="11.5" fill="#5c3a8c">picks which tool to call</text>
  <path d="M 185 515 C 185 585, 855 600, 855 542" stroke="#7a4fb5" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#pArrow)"/>
  <text x="520" y="592" text-anchor="middle" font-size="11.5" fill="#5c3a8c">the host sends the prompt + the tool list to the LLM, and gets back the tool choice</text>

  <defs>
    <marker id="gArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b3b3b"/>
    </marker>
    <marker id="oArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c98a00"/>
    </marker>
    <marker id="pArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4fb5"/>
    </marker>
  </defs>
</svg>
